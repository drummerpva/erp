services:
  db:
    image: mariadb:12.3
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "erp-refatorado"
    command:
      - --character-set-server=utf8mb3
      - --collation-server=utf8mb3_general_ci
    volumes:
      - ./legado:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 20s
      timeout: 10s
      start_period: 10s
      retries: 5

  db_pg:
    image: postgres:18-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: erp-refatorado
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dbgate:
    image: dbgate/dbgate
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
      db_pg:
        condition: service_healthy
